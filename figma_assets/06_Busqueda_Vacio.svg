<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" fill="#F7F3EB"/>

  <!-- Status Bar -->
  <text x="32" y="32" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">9:41</text>
  <rect x="330" y="20" width="28" height="12" rx="3" stroke="#2E3B33" stroke-width="1.5" fill="none"/>
  <rect x="332" y="22" width="20" height="8" rx="2" fill="#2E3B33"/>

  <!-- Search Header with Query -->
  <g transform="translate(24, 52)">
    <rect width="342" height="50" rx="25" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
    <circle cx="28" cy="25" r="7.5" stroke="#79776B" stroke-width="1.8" fill="none"/>
    <line x1="33" y1="30" x2="39" y2="36" stroke="#79776B" stroke-width="1.8"/>
    <text x="50" y="30" fill="#2E3B33" font-family="sans-serif" font-size="14" font-weight="500">Sushi de salmón</text>

    <!-- Clear button -->
    <circle cx="316" cy="25" r="12" fill="#F7F3EB"/>
    <line x1="312" y1="21" x2="320" y2="29" stroke="#79776B" stroke-width="1.6"/>
    <line x1="320" y1="21" x2="312" y2="29" stroke="#79776B" stroke-width="1.6"/>
  </g>

  <!-- Empty State Illustration & Content -->
  <g transform="translate(45, 230)">
    <!-- Food Plate with Magnifier Illustration -->
    <circle cx="150" cy="90" r="80" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="2"/>
    <circle cx="150" cy="90" r="60" fill="#F7F3EB"/>
    <ellipse cx="150" cy="90" rx="42" ry="25" fill="#BFAE8F" opacity="0.4"/>

    <!-- Search glass over plate -->
    <circle cx="170" cy="70" r="32" fill="#FFFFFF" stroke="#2E3B33" stroke-width="3"/>
    <line x1="192" y1="92" x2="216" y2="116" stroke="#2E3B33" stroke-width="4" stroke-linecap="round"/>
    <!-- Small food icon inside glass -->
    <circle cx="170" cy="70" r="10" fill="#B55538"/>

    <!-- Texts -->
    <text x="150" y="220" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" text-anchor="middle">Sin resultados</text>
    <text x="150" y="250" fill="#79776B" font-family="sans-serif" font-size="14" text-anchor="middle">No encontramos platillos para tu búsqueda.</text>
    <text x="150" y="272" fill="#79776B" font-family="sans-serif" font-size="14" text-anchor="middle">Prueba con pupusas, tacos o bebidas.</text>

    <!-- Action Button -->
    <g transform="translate(25, 310)">
      <rect width="250" height="50" rx="25" fill="#2E3B33"/>
      <text x="125" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Explorar el menú completo</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Búsqueda Active) -->
  <g transform="translate(16, 756)">
    <rect width="358" height="68" rx="24" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
    <!-- Home -->
    <g transform="translate(24, 22)">
      <path d="M14 11L21 6L28 11V18H14V11Z" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <text x="34" y="16" fill="#79776B" font-family="sans-serif" font-size="12" font-weight="500">Home</text>
    </g>
    <!-- Buscar Active -->
    <g transform="translate(112, 11)">
      <rect width="92" height="46" rx="23" fill="#2E3B33"/>
      <circle cx="28" cy="23" r="6" stroke="#BFAE8F" stroke-width="2" fill="none"/>
      <line x1="32" y1="27" x2="37" y2="32" stroke="#BFAE8F" stroke-width="2"/>
      <text x="46" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Buscar</text>
    </g>
    <!-- Cuenta -->
    <g transform="translate(226, 22)">
      <circle cx="12" cy="10" r="5" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <path d="M5 22C5 18 8 16 12 16C16 16 19 18 19 22" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <text x="30" y="16" fill="#79776B" font-family="sans-serif" font-size="12" font-weight="500">Cuenta</text>
    </g>
    <!-- Recibos -->
    <g transform="translate(300, 22)">
      <rect x="6" y="6" width="12" height="16" rx="2" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <line x1="9" y1="11" x2="15" y2="11" stroke="#79776B" stroke-width="1.4"/>
      <text x="24" y="16" fill="#79776B" font-family="sans-serif" font-size="12" font-weight="500">Recibos</text>
    </g>
  </g>
</svg>