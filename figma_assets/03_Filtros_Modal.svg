<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dimmed background of Home screen underneath -->
  <rect width="390" height="844" fill="#000000" fill-opacity="0.45"/>

  <!-- Modal / Bottom Sheet Container -->
  <g transform="translate(0, 110)">
    <rect width="390" height="734" rx="32" fill="#F7F3EB"/>

    <!-- Drag Handle -->
    <rect x="175" y="12" width="40" height="4" rx="2" fill="#79776B" opacity="0.4"/>

    <!-- Header -->
    <g transform="translate(24, 30)">
      <!-- Close button (X) -->
      <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
      <line x1="12" y1="12" x2="24" y2="24" stroke="#2E3B33" stroke-width="2"/>
      <line x1="24" y1="12" x2="12" y2="24" stroke="#2E3B33" stroke-width="2"/>

      <text x="171" y="24" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Filtros</text>

      <!-- Limpiar -->
      <text x="342" y="24" fill="#B55538" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">Limpiar</text>
    </g>

    <line x1="24" y1="80" x2="366" y2="80" stroke="#E8E0D2" stroke-width="1"/>

    <!-- 1. Categoría -->
    <g transform="translate(24, 100)">
      <text x="0" y="14" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Categoría</text>

      <!-- Chips -->
      <g transform="translate(0, 28)">
        <!-- Comida (Selected) -->
        <rect x="0" y="0" width="86" height="36" rx="18" fill="#2E3B33"/>
        <text x="43" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Comida</text>

        <!-- Bebidas -->
        <rect x="96" y="0" width="86" height="36" rx="18" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
        <text x="139" y="23" fill="#79776B" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Bebidas</text>

        <!-- Postres -->
        <rect x="192" y="0" width="86" height="36" rx="18" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
        <text x="235" y="23" fill="#79776B" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Postres</text>

        <!-- Snacks -->
        <rect x="288" y="0" width="70" height="36" rx="18" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
        <text x="323" y="23" fill="#79776B" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Snacks</text>
      </g>
    </g>

    <!-- 2. Rango de Precio (Predefined chips: "Cualquier precio", "Hasta $5.00", "$5.00 a $10.00", "$10.00 a $15.00", "Más de $15.00") -->
    <g transform="translate(24, 195)">
      <text x="0" y="14" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Rango de precio</text>

      <!-- Fila 1 de Chips -->
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="130" height="36" rx="18" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
        <text x="65" y="23" fill="#79776B" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Cualquier precio</text>

        <!-- Hasta $5.00 (Selected) -->
        <rect x="140" y="0" width="115" height="36" rx="18" fill="#2E3B33"/>
        <text x="197" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Hasta $5.00</text>

        <rect x="265" y="0" width="105" height="36" rx="18" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
        <text x="317" y="23" fill="#79776B" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">$5 a $10</text>
      </g>

      <!-- Fila 2 de Chips -->
      <g transform="translate(0, 74)">
        <rect x="0" y="0" width="125" height="36" rx="18" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
        <text x="62" y="23" fill="#79776B" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">$10.00 a $15.00</text>

        <rect x="135" y="0" width="120" height="36" rx="18" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
        <text x="195" y="23" fill="#79776B" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Más de $15.00</text>
      </g>
    </g>

    <!-- 3. Ingredientes (Vector Icons Only - NO Emojis) -->
    <g transform="translate(24, 340)">
      <text x="0" y="14" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Ingredientes destacados</text>

      <!-- Chips Grid -->
      <g transform="translate(0, 28)">
        <!-- Queso (Selected) -->
        <g transform="translate(0, 0)">
          <rect width="105" height="40" rx="20" fill="#2E3B33"/>
          <!-- Cheese vector icon -->
          <path d="M16 26L26 14V26H16Z" fill="#BFAE8F"/>
          <circle cx="21" cy="23" r="1.5" fill="#2E3B33"/>
          <text x="36" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Queso</text>
        </g>

        <!-- Tomate -->
        <g transform="translate(115, 0)">
          <rect width="110" height="40" rx="20" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
          <!-- Tomato vector icon -->
          <circle cx="22" cy="20" r="7" fill="#B55538"/>
          <path d="M22 13V10M19 11L25 11" stroke="#2E3B33" stroke-width="1.5"/>
          <text x="38" y="25" fill="#2E3B33" font-family="sans-serif" font-size="13" font-weight="500">Tomate</text>
        </g>

        <!-- Aguacate -->
        <g transform="translate(235, 0)">
          <rect width="120" height="40" rx="20" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
          <!-- Avocado vector icon -->
          <ellipse cx="22" cy="20" rx="6" ry="8" fill="#5A785A"/>
          <circle cx="22" cy="22" r="3.5" fill="#BFAE8F"/>
          <text x="36" y="25" fill="#2E3B33" font-family="sans-serif" font-size="13" font-weight="500">Aguacate</text>
        </g>

        <!-- Chile -->
        <g transform="translate(0, 50)">
          <rect width="105" height="40" rx="20" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
          <!-- Chili vector icon -->
          <path d="M16 23C16 18 20 15 24 15C25 15 25 18 22 23C20 26 16 26 16 23Z" fill="#B55538"/>
          <text x="36" y="25" fill="#2E3B33" font-family="sans-serif" font-size="13" font-weight="500">Chile</text>
        </g>

        <!-- Frijol -->
        <g transform="translate(115, 50)">
          <rect width="105" height="40" rx="20" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
          <!-- Bean icon -->
          <ellipse cx="22" cy="20" rx="7" ry="5" fill="#79776B"/>
          <text x="38" y="25" fill="#2E3B33" font-family="sans-serif" font-size="13" font-weight="500">Frijol</text>
        </g>
      </g>
    </g>

    <!-- Bottom Action Button -->
    <g transform="translate(24, 620)">
      <rect width="342" height="54" rx="27" fill="#2E3B33"/>
      <text x="171" y="33" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Aplicar filtros • 3 platillos</text>
    </g>
  </g>
</svg>