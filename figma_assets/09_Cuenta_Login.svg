  <rect x="330" y="20" width="28" height="12" rx="3" stroke="#2E3B33" stroke-width="1.5" fill="none"/>
  <rect x="332" y="22" width="20" height="8" rx="2" fill="#2E3B33"/>

  <!-- Back Nav & Header -->
