      <rect x="0" y="12" width="342" height="52" rx="16" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
      <!-- Password dots -->
      <circle cx="24" cy="38" r="4" fill="#2E3B33"/>
      <circle cx="36" cy="38" r="4" fill="#2E3B33"/>
      <circle cx="48" cy="38" r="4" fill="#2E3B33"/>
      <circle cx="60" cy="38" r="4" fill="#2E3B33"/>
      <circle cx="72" cy="38" r="4" fill="#2E3B33"/>
      <circle cx="84" cy="38" r="4" fill="#2E3B33"/>
      <circle cx="96" cy="38" r="4" fill="#2E3B33"/>
      <circle cx="108" cy="38" r="4" fill="#2E3B33"/>

