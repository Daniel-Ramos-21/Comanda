<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" fill="#F7F3EB"/>

  <!-- Status Bar -->
  <text x="32" y="32" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">9:41</text>
  <rect x="330" y="20" width="28" height="12" rx="3" stroke="#2E3B33" stroke-width="1.5" fill="none"/>
  <rect x="332" y="22" width="20" height="8" rx="2" fill="#2E3B33"/>

  <!-- Header -->
  <g transform="translate(24, 60)">
    <text x="0" y="20" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">Tus Recibos</text>
  </g>

  <!-- Empty State Graphic & Content -->
  <g transform="translate(45, 230)">
    <!-- Receipt illustration -->
    <rect x="105" y="40" width="90" height="120" rx="14" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="2"/>
    <circle cx="150" cy="70" r="14" fill="#BFAE8F" opacity="0.4"/>
    <line x1="125" y1="95" x2="175" y2="95" stroke="#79776B" stroke-width="2"/>
    <line x1="125" y1="105" x2="165" y2="105" stroke="#79776B" stroke-width="2"/>
    <line x1="125" y1="115" x2="175" y2="115" stroke="#79776B" stroke-width="2"/>
    <line x1="125" y1="130" x2="175" y2="130" stroke="#2E3B33" stroke-width="2.5"/>

    <text x="150" y="200" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" text-anchor="middle">Aún no tienes recibos</text>
    <text x="150" y="230" fill="#79776B" font-family="sans-serif" font-size="13" text-anchor="middle">Tus pedidos confirmados y el detalle de tus</text>
    <text x="150" y="250" fill="#79776B" font-family="sans-serif" font-size="13" text-anchor="middle">entregas se guardarán automáticamente aquí.</text>

    <!-- Action Button -->
    <g transform="translate(30, 290)">
      <rect width="240" height="50" rx="25" fill="#2E3B33"/>
      <text x="120" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Explorar el menú ahora</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Recibos Active) -->
  <g transform="translate(16, 756)">
    <rect width="358" height="68" rx="24" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
    <!-- Home -->
    <g transform="translate(24, 22)">
      <path d="M14 11L21 6L28 11V18H14V11Z" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <text x="34" y="16" fill="#79776B" font-family="sans-serif" font-size="12" font-weight="500">Home</text>
    </g>
    <!-- Buscar -->
    <g transform="translate(122, 22)">
      <circle cx="14" cy="12" r="7" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <line x1="19" y1="17" x2="24" y2="22" stroke="#79776B" stroke-width="1.8"/>
      <text x="34" y="16" fill="#79776B" font-family="sans-serif" font-size="12" font-weight="500">Buscar</text>
    </g>
    <!-- Cuenta -->
    <g transform="translate(216, 22)">
      <circle cx="12" cy="10" r="5" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <path d="M5 22C5 18 8 16 12 16C16 16 19 18 19 22" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <text x="30" y="16" fill="#79776B" font-family="sans-serif" font-size="12" font-weight="500">Cuenta</text>
    </g>
    <!-- Recibos Active -->
    <g transform="translate(288, 11)">
      <rect width="92" height="46" rx="23" fill="#2E3B33"/>
      <rect x="20" y="15" width="12" height="16" rx="2" stroke="#BFAE8F" stroke-width="2" fill="none"/>
      <line x1="23" y1="20" x2="29" y2="20" stroke="#BFAE8F" stroke-width="1.6"/>
      <line x1="23" y1="24" x2="29" y2="24" stroke="#BFAE8F" stroke-width="1.6"/>
      <text x="38" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Recibos</text>
    </g>
  </g>
</svg>