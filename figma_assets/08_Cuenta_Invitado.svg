<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" fill="#F7F3EB"/>

  <!-- Status Bar -->
  <text x="32" y="32" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">9:41</text>
  <rect x="330" y="20" width="28" height="12" rx="3" stroke="#2E3B33" stroke-width="1.5" fill="none"/>
  <rect x="332" y="22" width="20" height="8" rx="2" fill="#2E3B33"/>

  <!-- Header -->
  <g transform="translate(24, 60)">
    <text x="0" y="20" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">Mi Cuenta</text>
  </g>

  <!-- Guest Card Banner -->
  <g transform="translate(24, 110)">
    <rect width="342" height="260" rx="24" fill="#2E3B33"/>

    <!-- Decorative graphic inside -->
    <circle cx="280" cy="50" r="70" fill="#BFAE8F" opacity="0.2"/>
    <circle cx="50" cy="210" r="50" fill="#B55538" opacity="0.2"/>

    <g transform="translate(24, 30)">
      <!-- Logo Icon -->
      <rect width="40" height="40" rx="12" fill="#BFAE8F"/>
      <circle cx="20" cy="20" r="9" fill="#2E3B33"/>

      <text x="0" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Bienvenido a Munchly</text>
      <text x="0" y="100" fill="#BFAE8F" font-family="sans-serif" font-size="13">Inicia sesión para una experiencia completa:</text>

      <g transform="translate(0, 125)">
        <circle cx="6" cy="6" r="3" fill="#BFAE8F"/>
        <text x="18" y="10" fill="#FFFFFF" font-family="sans-serif" font-size="12">Guarda tus platillos favoritos</text>

        <circle cx="6" cy="30" r="3" fill="#BFAE8F"/>
        <text x="18" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="12">Consulta recibos y pedidos en tiempo real</text>

        <circle cx="6" cy="54" r="3" fill="#BFAE8F"/>
        <text x="18" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="12">Paga rápido con tus métodos guardados</text>
      </g>
    </g>
  </g>

  <!-- Action Buttons -->
  <g transform="translate(24, 400)">
    <!-- Login Button -->
    <rect width="342" height="52" rx="26" fill="#2E3B33"/>
    <text x="171" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Iniciar sesión</text>

    <!-- Register Button -->
    <g transform="translate(0, 68)">
      <rect width="342" height="52" rx="26" fill="#FFFFFF" stroke="#2E3B33" stroke-width="1.8"/>
      <text x="171" y="32" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Crear una cuenta nueva</text>
    </g>
  </g>

  <!-- Help & Privacy links -->
  <g transform="translate(24, 560)">
    <rect width="342" height="60" rx="16" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
    <text x="20" y="35" fill="#2E3B33" font-family="sans-serif" font-size="14" font-weight="600">Centro de ayuda y soporte</text>
    <path d="M310 28L318 35L310 42" stroke="#79776B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bottom Navigation Bar (Cuenta Active) -->
  <g transform="translate(16, 756)">
    <rect width="358" height="68" rx="24" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
    <!-- Home -->
    <g transform="translate(24, 22)">
      <path d="M14 11L21 6L28 11V18H14V11Z" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <text x="34" y="16" fill="#79776B" font-family="sans-serif" font-size="12" font-weight="500">Home</text>
    </g>
    <!-- Buscar -->
    <g transform="translate(122, 22)">
      <circle cx="14" cy="12" r="7" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <line x1="19" y1="17" x2="24" y2="22" stroke="#79776B" stroke-width="1.8"/>
      <text x="34" y="16" fill="#79776B" font-family="sans-serif" font-size="12" font-weight="500">Buscar</text>
    </g>
    <!-- Cuenta Active -->
    <g transform="translate(208, 11)">
      <rect width="92" height="46" rx="23" fill="#2E3B33"/>
      <circle cx="28" cy="20" r="5" stroke="#BFAE8F" stroke-width="2" fill="none"/>
      <path d="M21 32C21 28 24 26 28 26C32 26 35 28 35 32" stroke="#BFAE8F" stroke-width="2" fill="none"/>
      <text x="46" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Cuenta</text>
    </g>
    <!-- Recibos -->
    <g transform="translate(306, 22)">
      <rect x="6" y="6" width="12" height="16" rx="2" stroke="#79776B" stroke-width="1.8" fill="none"/>
      <line x1="9" y1="11" x2="15" y2="11" stroke="#79776B" stroke-width="1.4"/>
      <text x="24" y="16" fill="#79776B" font-family="sans-serif" font-size="12" font-weight="500">Recibos</text>
    </g>
  </g>
</svg>