<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" fill="#F7F3EB"/>

  <!-- Status Bar -->
  <text x="32" y="32" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">9:41</text>
  <rect x="330" y="20" width="28" height="12" rx="3" stroke="#2E3B33" stroke-width="1.5" fill="none"/>
  <rect x="332" y="22" width="20" height="8" rx="2" fill="#2E3B33"/>

  <!-- Back Nav & Header -->
  <g transform="translate(24, 52)">
    <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
    <path d="M23 12L15 20L23 28" stroke="#2E3B33" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(24, 110)">
    <text x="0" y="24" fill="#2E3B33" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">Crear cuenta</text>
    <text x="0" y="50" fill="#79776B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Disfruta de la mejor gastronomía con Munchly.</text>
  </g>

  <!-- Form Fields -->
  <g transform="translate(24, 190)">
    <!-- Full Name -->
    <text x="4" y="0" fill="#2E3B33" font-family="sans-serif" font-size="13" font-weight="700">Nombre completo</text>
    <rect x="0" y="10" width="342" height="50" rx="16" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
    <text x="18" y="41" fill="#2E3B33" font-family="sans-serif" font-size="14">Daniel Ramos</text>

    <!-- Email -->
    <g transform="translate(0, 76)">
      <text x="4" y="0" fill="#2E3B33" font-family="sans-serif" font-size="13" font-weight="700">Correo electrónico</text>
      <rect x="0" y="10" width="342" height="50" rx="16" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
      <text x="18" y="41" fill="#79776B" font-family="sans-serif" font-size="14">tu-correo@ejemplo.com</text>
    </g>

    <!-- Password -->
    <g transform="translate(0, 152)">
      <text x="4" y="0" fill="#2E3B33" font-family="sans-serif" font-size="13" font-weight="700">Contraseña</text>
      <rect x="0" y="10" width="342" height="50" rx="16" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
      <text x="18" y="41" fill="#79776B" font-family="sans-serif" font-size="14">Mínimo 8 caracteres</text>
    </g>

    <!-- Confirm Password -->
    <g transform="translate(0, 228)">
      <text x="4" y="0" fill="#2E3B33" font-family="sans-serif" font-size="13" font-weight="700">Confirmar contraseña</text>
      <rect x="0" y="10" width="342" height="50" rx="16" fill="#FFFFFF" stroke="#E8E0D2" stroke-width="1"/>
      <text x="18" y="41" fill="#79776B" font-family="sans-serif" font-size="14">Repite tu contraseña</text>
    </g>

    <!-- Terms Checkbox -->
    <g transform="translate(4, 305)">
      <rect width="20" height="20" rx="6" fill="#2E3B33"/>
      <path d="M5 10L9 14L15 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="30" y="15" fill="#2E3B33" font-family="sans-serif" font-size="12">Acepto los Términos de Servicio y Privacidad</text>
    </g>

    <!-- Submit Button -->
    <g transform="translate(0, 350)">
      <rect width="342" height="52" rx="26" fill="#2E3B33"/>
      <text x="171" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Crear mi cuenta</text>
    </g>
  </g>

  <!-- Login Link Footer -->
  <g transform="translate(24, 765)">
    <text x="171" y="20" fill="#79776B" font-family="sans-serif" font-size="13" text-anchor="middle">¿Ya tienes cuenta? <tspan fill="#2E3B33" font-weight="700">Inicia sesión</tspan></text>
  </g>
</svg>